<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USDA Balance Sheets</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background:#0b0f14; color:#e6e6e6; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  #meta { color:#888; font-size:13px; margin-bottom:20px; }
  .comm { margin-bottom:32px; }
  .comm h2 { font-size:16px; border-bottom:1px solid #333; padding-bottom:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:5px 10px; text-align:right; border-bottom:1px solid #222; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#9ab; font-weight:600; }
  tr:hover { background:#151b22; }
  .world { font-weight:700; color:#fff; background:#141a20; }
</style>
</head>
<body>
<h1>USDA Balance Sheets — Wheat / Corn / Soybeans / Canola</h1>
<div id="meta">Loading...</div>
<div id="root"></div>

<script>
const ATTR_LABELS = { bs:"Beg. Stocks", pr:"Production", im:"Imports", dc:"Domestic Use", ex:"Exports", es:"End. Stocks" };
const ATTR_ORDER = ["bs","pr","im","dc","ex","es"];

fetch('data/psd_data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('meta').textContent =
      'Last updated: ' + (data._meta?.fetched_at || 'unknown');

    const root = document.getElementById('root');
    for (const comm of Object.keys(data)) {
      if (comm.startsWith('_')) continue;
      const countries = data[comm];
      const allYears = new Set();
      Object.values(countries).forEach(yrs => Object.keys(yrs).forEach(y => allYears.add(y)));
      const years = [...allYears].sort().slice(-3); // last 3 marketing years
      if (!years.length) continue;

      const section = document.createElement('div');
      section.className = 'comm';
      const latestYear = years[years.length - 1];

      let html = `<h2>${comm} — ${latestYear} (1000 MT)</h2><table><thead><tr><th>Country</th>`;
      ATTR_ORDER.forEach(a => html += `<th>${ATTR_LABELS[a]}</th>`);
      html += `</tr></thead><tbody>`;

      const countryNames = Object.keys(countries).filter(c => c !== 'World').sort();
      countryNames.push('World');

      countryNames.forEach(c => {
        const row = countries[c]?.[latestYear] || {};
        const cls = c === 'World' ? 'world' : '';
        html += `<tr class="${cls}"><td>${c}</td>`;
        ATTR_ORDER.forEach(a => {
          const v = row[a];
          html += `<td>${v != null ? v.toLocaleString() : '—'}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table>`;
      section.innerHTML = html;
      root.appendChild(section);
    }
  })
  .catch(e => {
    document.getElementById('meta').textContent = 'Error loading data: ' + e;
  });
</script>
</body>
</html>
