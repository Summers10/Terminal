<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USDA Balance Sheets</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--row-alt:#030303;--row-latest:#0c0800;
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--row-alt:#F7F8FA;--row-latest:#FFF3DC;
}
#topbar{position:sticky;top:0;z-index:10;padding:14px 20px;border-bottom:1px solid var(--amber);background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#topbar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
#conv-label{font-size:12px;color:var(--text3);letter-spacing:.04em;white-space:nowrap}
#meta{font-size:13px;color:var(--text3);letter-spacing:.04em;margin-left:auto}
.toggle{display:flex;border:1px solid var(--border2);border-radius:3px;overflow:hidden}
.tbtn{padding:7px 15px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .1s}
.tbtn.active{background:var(--amber);color:#000}
.tbtn:hover:not(.active){color:var(--amber)}
#root{max-width:1280px;margin:0 auto;padding:22px}
.sec-hdr{font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);padding:16px 0 9px;border-bottom:2px solid var(--amber);margin:32px 0 14px}
.sec-hdr:first-child{margin-top:0}
.panel{border-bottom:2px solid var(--amber);margin-bottom:20px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber)}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em;margin-left:8px}
.tbl-wrap{overflow-x:auto}
.bal-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.bal-table th{background:var(--th-bg);padding:8px 8px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}
.bal-table th:first-child{text-align:left;font-size:14px;letter-spacing:.08em}
.bal-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.bal-table th.yoy{color:var(--text3);font-style:italic}
.bal-table td{padding:5px 8px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.bal-table td:first-child{text-align:left;color:var(--text);font-weight:700}
td.latest{color:var(--amber) !important;font-weight:800 !important}
.row-section td{background:var(--section-bg);color:var(--text3) !important;font-size:12px !important;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 4px;border-top:1px solid var(--border2)}
.row-alt td{background:var(--row-alt) !important}
.row-total td{font-weight:800;font-size:16px !important;color:var(--amber) !important}
.row-ending td{font-weight:900;font-size:16px !important;color:var(--text) !important;background:var(--row-latest) !important}
.row-stu td{font-style:italic;color:var(--amber) !important;font-size:15px !important}
.row-pctile td{font-style:italic;font-size:13px !important;border-bottom:2px solid var(--border2)}
td.pctile-tight{color:var(--red) !important;font-weight:800 !important}
td.pctile-loose{color:var(--green) !important;font-weight:800 !important}
td.pctile-mid{color:var(--text3) !important}
td.up{color:var(--green) !important}
td.dn{color:var(--red) !important}
.stack-wrap{display:flex;flex-direction:column;gap:0}
#err{padding:40px;text-align:center;color:var(--red);font-size:16px}
</style>
</head>
<body class="light">

<script>
function checkPw(){
  var p = document.getElementById('pw-input').value;
  if(p === 'Plamoil'){
    document.getElementById('pw-gate').style.display = 'none';
    sessionStorage.setItem('pw-ok', '1');
  } else {
    document.getElementById('pw-err').textContent = 'Invalid password';
  }
}
if(sessionStorage.getItem('pw-ok') === '1') document.getElementById('pw-gate').style.display = 'none';
</script>

    <button class="global-theme-btn" data-t="light" style="padding:7px 15px;background:#f5a623;border:none;color:#000;cursor:pointer;font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Light</button>

<script>
function setGlobalTheme(theme){
  document.body.classList.toggle('dark', theme==='dark');
  document.body.classList.toggle('light', theme==='light');
  document.querySelectorAll('.global-theme-btn').forEach(function(b){
    const active = b.dataset.t === theme;
    b.style.background = active ? '#f5a623' : 'none';
    b.style.color = active ? '#000' : '#6a5a4a';
  });
  const usdaToggle = document.getElementById('theme-toggle');
  if(usdaToggle){
    usdaToggle.querySelectorAll('.tbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.t===theme); });
  }
  if(typeof currentTheme !== 'undefined') currentTheme = theme;
}
document.querySelectorAll('.global-theme-btn').forEach(function(b){
  b.addEventListener('click', function(){ setGlobalTheme(b.dataset.t); });
});
document.querySelectorAll('.page-tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.page-tab').forEach(function(b){ b.classList.remove('active'); b.style.color = '#6a5a4a'; });
    btn.classList.add('active'); btn.style.color = '#f5a623';
    document.getElementById('summary-page').style.display = btn.dataset.page === 'summary' ? '' : 'none';
    document.getElementById('usda-page').style.display = btn.dataset.page === 'usda' ? '' : 'none';
    document.getElementById('cftc-page').style.display = btn.dataset.page === 'cftc' ? '' : 'none';
    document.getElementById('seasonals-page').style.display = btn.dataset.page === 'seasonals' ? '' : 'none';
    document.getElementById('exports-page').style.display = btn.dataset.page === 'exports' ? '' : 'none';
  });
});
</script>

<script>
const COMMS = ["Wheat","Corn","Soybeans","Rapeseed/Canola","Oats","Cotton","Vegoils","Meal"];
const BU_PER_MT = {Wheat:36.7437, Corn:39.3680, Soybeans:36.7437, "Rapeseed/Canola":44.0924, Oats:68.8955};
const ACRES_PER_HA = 2.47105;
const HIST_YEARS = 7;

const EXPORTERS = {
  Wheat: ["United States","European Union","Russia","Canada","Australia","Ukraine","Argentina"],
  Corn: ["United States","Brazil","Argentina","Ukraine","European Union"],
  Soybeans: ["United States","Brazil","Argentina","Paraguay"],
  "Rapeseed/Canola": ["Canada","Australia","European Union","Ukraine"],
  Oats: ["Canada"],
  Cotton: ["United States","Brazil","Australia","India"]
};
const IMPORTERS = {
  Wheat: ["China","Indonesia","Egypt","Turkey","Algeria","Brazil","Japan","Philippines","Morocco","South Korea","Mexico","Bangladesh"],
  Corn: ["China","Mexico","Japan","South Korea","Vietnam","Egypt","Colombia","Malaysia","Algeria","Indonesia","Iran"],
  Soybeans: ["China","European Union","Mexico","Japan","Egypt","Thailand","Indonesia","Turkey","Bangladesh","Taiwan"],
  "Rapeseed/Canola": ["China","Japan","Bangladesh","Pakistan","Mexico","United States","South Korea"],
  Oats: ["United States"],
  Cotton: ["Bangladesh","Vietnam","China","Pakistan","Indonesia","Turkey"]
};

let DATA = null;
let currentComm = "Wheat";
let currentUnit = "mt";
let currentTheme = "light";

function fmt(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return Math.round(v).toLocaleString();
}
function fmt2(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toFixed(1);
}
function fmtStu(v){ return v===null ? '—' : v.toFixed(1)+'%'; }
function ordinal(n){
  const r = Math.round(n);
  const mod100 = r % 100;
  if(mod100>=11 && mod100<=13) return r+'th';
  switch(r % 10){
    case 1: return r+'st';
    case 2: return r+'nd';
    case 3: return r+'rd';
    default: return r+'th';
  }
}
function fmtYoy(v){
  if(v===null) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(1)+'%';
}
function yoyPct(cur,prev){
  if(cur===null||prev===null||prev===0) return null;
  return (cur-prev)/Math.abs(prev)*100;
}

function getRaw(yearData, key){
  const v = yearData ? yearData[key] : undefined;
  return (v!==undefined && !isNaN(v)) ? v : null;
}
function getTotalRaw(yearData, keys){
  let sum=0, any=false;
  for(const k of keys){ const v=getRaw(yearData,k); if(v!==null){sum+=v;any=true;} }
  return any?sum:null;
}
function getStu(yearData){
  const end=getRaw(yearData,'es'), dom=getRaw(yearData,'dc'), exp=getRaw(yearData,'ex');
  if(end===null||dom===null) return null;
  const denom=dom+(exp||0);
  return denom>0 ? (end/denom)*100 : null;
}
function convertVal(raw, unit, comm){
  if(raw===null) return null;
  if(comm==='Cotton') return raw; // cotton stays in its native USDA unit (1000 480-lb bales), no bu/mt conversion applies
  if(unit==='bu') return raw * (BU_PER_MT[comm]||36.7437) / 1000;
  return raw;
}
function yieldBuAc(prRaw, ahRaw, comm){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const mtPerHa = prRaw/ahRaw;
  return mtPerHa * (BU_PER_MT[comm]||36.7437) / ACRES_PER_HA;
}
// Cotton yield, authentic to how cotton traders read it: lbs of lint per harvested acre,
// not bushels — cotton isn't a bushel commodity. 1 bale = 480 lb (USDA's own cotton unit).
function yieldLbAcCotton(prRaw, ahRaw){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const balesPerHa = prRaw/ahRaw;
  return balesPerHa * 480 / ACRES_PER_HA;
}
function acresK(ahRaw){ return ahRaw===null ? null : ahRaw*ACRES_PER_HA; }

function sumCountries(countries, countryNames, year){
  const keys=['ah','bs','pr','im','dc','ex','es'];
  const out={}; let any=false;
  for(const k of keys){
    let s=0, has=false;
    for(const c of countryNames){
      const cd = countries[c];
      const v = cd && cd[year] ? cd[year][k] : undefined;
      if(v!==undefined && !isNaN(v)){ s+=v; has=true; any=true; }
    }
    out[k]= has ? s : undefined;
  }
  return any ? out : null;
}

function unitLabel(){ return currentComm==='Cotton' ? '1000 Bales (480 lb)' : (currentUnit==='bu' ? 'Million Bu' : '1000 MT'); }

function buildBalanceTable(comm, yearDataFn, years, includeYoy, allYearsFull){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;

  // Full-history S/U values (not just the displayed years) for percentile ranking.
  const fullYears = allYearsFull || years;
  const stuHistory = fullYears.map(y => getStu(yearDataFn(y))).filter(v => v!==null);
  function stuPctile(y){
    const v = getStu(yearDataFn(y));
    if(v===null || stuHistory.length===0) return null;
    const countLE = stuHistory.filter(x => x<=v).length;
    return (countLE/stuHistory.length)*100;
  }

  const isCotton = comm === 'Cotton';
  const ROWS = [
    {type:'row', key:'ah', label:'Area harvested (1000 ac)', area:true},
    {type:'row', key:'yl', label: isCotton ? 'Yield (lb lint/ac)' : 'Yield (bu/ac)', yield:true},
    {type:'section', label:'Supply'},
    {type:'row', key:'bs', label:'Beginning stocks'},
    {type:'row', key:'pr', label:'Production'},
    {type:'row', key:'im', label:'Imports'},
    {type:'total', keys:['bs','pr','im'], label:'Total supply'},
    {type:'section', label:'Use'},
    {type:'row', key:'dc', label: isCotton ? 'Mill use' : 'Dom. consumption'},
    {type:'row', key:'ex', label:'Exports'},
    {type:'total', keys:['dc','ex'], label:'Total demand'},
    {type:'section', label:'Balance'},
    {type:'row', key:'es', label:'Ending stocks', cls:'row-ending'},
    {type:'stu', label:'Stocks / Use %', cls:'row-stu'},
    {type:'stu_pctile', label:'S/U Percentile Rank (' + fullYears.length + 'yr hist)', cls:'row-pctile'},
  ];

  function displayVal(row, y){
    const yd = yearDataFn(y);
    if(row.area) return acresK(getRaw(yd,'ah'));
    if(row.yield) return isCotton ? yieldLbAcCotton(getRaw(yd,'pr'), getRaw(yd,'ah')) : yieldBuAc(getRaw(yd,'pr'), getRaw(yd,'ah'), comm);
    if(row.type==='total') return convertVal(getTotalRaw(yd, row.keys), currentUnit, comm);
    if(row.type==='stu') return getStu(yd);
    if(row.type==='stu_pctile') return stuPctile(y);
    return convertVal(getRaw(yd, row.key), currentUnit, comm);
  }

  let html = `<div class="tbl-wrap"><table class="bal-table"><colgroup><col style="width:175px">`;
  for(const y of years) html += '<col>';
  if(includeYoy) html += '<col style="width:75px">';
  html += `</colgroup><thead><tr><th>ITEM</th>`;
  for(const y of years) html += `<th class="${y===latestYear?'latest':''}">${y}</th>`;
  if(includeYoy) html += `<th class="yoy">YoY Δ</th>`;
  html += `</tr></thead><tbody>`;

  let alt=false;
  for(const row of ROWS){
    if(row.type==='section'){
      html += `<tr class="row-section"><td colspan="${years.length+1+(includeYoy?1:0)}">${row.label}</td></tr>`;
      alt=false; continue;
    }
    const cls=[row.cls||'', alt?'row-alt':''].filter(Boolean).join(' ');
    html += `<tr class="${cls}"><td>${row.label}</td>`;
    alt=!alt;
    const vals = years.map(y=>displayVal(row,y));
    for(let i=0;i<years.length;i++){
      const v=vals[i], prev=i>0?vals[i-1]:null;
      let tdCls = years[i]===latestYear?'latest':'';
      if(row.type!=='stu' && row.type!=='stu_pctile' && v!==null && prev!==null){
        if(v>prev) tdCls+=' up'; else if(v<prev) tdCls+=' dn';
      }
      if(row.type==='stu_pctile' && v!==null){
        tdCls += v<=25 ? ' pctile-tight' : (v>=75 ? ' pctile-loose' : ' pctile-mid');
      }
      const text = row.type==='stu' ? fmtStu(v) : (row.type==='stu_pctile' ? (v===null?'—':ordinal(v)) : (row.yield ? fmt2(v) : fmt(v)));
      html += `<td class="${tdCls.trim()}">${text}</td>`;
    }
    if(includeYoy){
      if(row.type==='stu_pctile'){
        html += `<td class="latest">—</td>`;
      } else {
        const cur = displayVal(row, latestYear);
        const prev = prevYear ? displayVal(row, prevYear) : null;
        const yoy = row.type==='stu' ? (cur!==null&&prev!==null?cur-prev:null) : yoyPct(cur,prev);
        let cls = 'latest';
        if(yoy!==null){ cls += yoy>0?' up':(yoy<0?' dn':''); }
        const text = row.type==='stu' ? (yoy===null?'—':(yoy>=0?'+':'')+yoy.toFixed(1)+'pp') : fmtYoy(yoy);
        html += `<td class="${cls}">${text}</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function panelWrap(title, sub, innerHtml){
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span><span class="panel-sub">${sub}</span></div>${innerHtml}</div>`;
}

// Multi-year, country-by-year breakout table for a single metric (e.g. Acres across N years), plus YoY change.
function buildMetricByCountryTable(countryList, countries, years, metric){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;
  let html = `<div class="tbl-wrap"><table class="bal-table"><thead><tr><th>Country</th>`;
  years.forEach(y=>{ html += `<th class="${y===latestYear?'latest':''}">${y}</th>`; });
  html += `<th class="yoy">YoY Δ</th>`;
  html += `</tr></thead><tbody>`;

  let alt=false;
  const totals = {};
  years.forEach(y=>totals[y]={sum:0,has:false});

  function metricVal(cd, y){
    if(metric==='ah') return acresK(getRaw(cd[y], 'ah'));
    return convertVal(getRaw(cd[y], metric), currentUnit, currentComm);
  }

  countryList.forEach(c=>{
    const cd = countries[c] || {};
    html += `<tr class="${alt?'row-alt':''}"><td>${c}</td>`;
    alt=!alt;
    let prevVal = null;
    years.forEach(y=>{
      const v = metricVal(cd, y);
      if(v!==null){ totals[y].sum += v; totals[y].has = true; }
      let cls = y===latestYear ? 'latest' : '';
      if(v!==null && prevVal!==null){ cls += v>prevVal?' up':(v<prevVal?' dn':''); }
      html += `<td class="${cls.trim()}">${fmt(v)}</td>`;
      prevVal = v;
    });
    const curV = metricVal(cd, latestYear);
    const prevV = prevYear ? metricVal(cd, prevYear) : null;
    const yoy = yoyPct(curV, prevV);
    let yoyCls = 'latest';
    if(yoy!==null){ yoyCls += yoy>0?' up':(yoy<0?' dn':''); }
    html += `<td class="${yoyCls}">${fmtYoy(yoy)}</td>`;
    html += `</tr>`;
  });

  html += `<tr class="row-total"><td>Total</td>`;
  years.forEach(y=>{
    const t = totals[y];
    const v = t.has ? t.sum : null;
    html += `<td>${fmt(v)}</td>`;
  });
  const totCur = totals[latestYear].has ? totals[latestYear].sum : null;
  const totPrev = prevYear && totals[prevYear].has ? totals[prevYear].sum : null;
  const totYoy = yoyPct(totCur, totPrev);
  html += `<td>${fmtYoy(totYoy)}</td>`;
  html += `</tr></tbody></table></div>`;
  return html;
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  const comm = currentComm;

  const convLabel = document.getElementById('conv-label');
  const unitToggleEl = document.getElementById('unit-toggle');

  // Vegoils: a different shape entirely — combines 4 separate oil commodities
  // rather than showing one commodity's own data, so it's handled as its own
  // render path rather than the shared World/Exporters/Importers/breakout template.
  if(comm === 'Vegoils'){
    if(unitToggleEl) unitToggleEl.style.display = 'none';
    convLabel.textContent = '1000 MT — Palm + Soybean + Rapeseed + Sunflower oil (no bushel conversion; oils have no acreage)';
    renderVegoilsInto(root);
    return;
  }
  if(comm === 'Meal'){
    if(unitToggleEl) unitToggleEl.style.display = 'none';
    convLabel.textContent = '1000 MT — Soybean + Rapeseed + Sunflower meal (no bushel conversion; meal has no acreage)';
    renderMealInto(root);
    return;
  }
  if(unitToggleEl) unitToggleEl.style.display = (comm === 'Cotton') ? 'none' : '';

  const countries = DATA[comm];

  if(comm === 'Cotton'){
    convLabel.textContent = 'Native USDA units — 1000 bales (480 lb), acres, lb lint/acre. No MT or bushel conversion (cotton isn\'t a bushel commodity).';
  } else {
    const buPerMt = BU_PER_MT[comm] || 36.7437;
    convLabel.textContent = `1 MT = ${buPerMt.toFixed(2)} bu (${comm==='Rapeseed/Canola'?'Canola':comm})`;
  }

  if(!countries){ root.innerHTML = '<div id="err">No data for '+comm+'</div>'; return; }

  const allYears = new Set();
  Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>allYears.add(y)));
  const yearsAll = [...allYears].sort();
  const years10 = yearsAll.slice(-HIST_YEARS);
  if(!years10.length){ root.innerHTML = '<div id="err">No years of data available</div>'; return; }

  const expList = (EXPORTERS[comm]||[]).filter(c=>countries[c]);
  const impList = (IMPORTERS[comm]||[]).filter(c=>countries[c]);

  // Oats: simplified view — just the two country balance sheets, nothing else.
  if(comm === 'Oats'){
    root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Oats — Canada / United States Balance Sheets</div>`);
    const stackOats = document.createElement('div');
    stackOats.className = 'stack-wrap';
    ['Canada','United States'].filter(c=>countries[c]).forEach(c=>{
      stackOats.insertAdjacentHTML('beforeend', panelWrap(c.toUpperCase(), unitLabel(),
        buildBalanceTable(comm, y=>(countries[c]||{})[y], years10, true, yearsAll)));
    });
    root.appendChild(stackOats);
    return;
  }

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — ${comm}</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('WORLD', unitLabel(),
    buildBalanceTable(comm, y=>(countries['World']||{})[y], years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate Balance Sheet</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('MAJOR EXPORTERS', expList.join(', '),
    buildBalanceTable(comm, y=>sumCountries(countries, expList, y), years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate Balance Sheet</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('MAJOR IMPORTERS', impList.join(', '),
    buildBalanceTable(comm, y=>sumCountries(countries, impList, y), years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Individual Balance Sheets</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  expList.forEach(c=>{
    stack.insertAdjacentHTML('beforeend', panelWrap(c.toUpperCase(), unitLabel(),
      buildBalanceTable(comm, y=>(countries[c]||{})[y], years10, true, yearsAll)));
  });
  root.appendChild(stack);

  // Exporters: Acres / Production / Exports, each as its own 10-year country x year table
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — 10-Year Country Breakout</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('ACRES', 'Exporters — 1000 acres',
    buildMetricByCountryTable(expList, countries, years10, 'ah')));
  root.insertAdjacentHTML('beforeend', panelWrap('PRODUCTION', 'Exporters — ' + unitLabel(),
    buildMetricByCountryTable(expList, countries, years10, 'pr')));
  root.insertAdjacentHTML('beforeend', panelWrap('EXPORTS', 'Exporters — ' + unitLabel(),
    buildMetricByCountryTable(expList, countries, years10, 'ex')));

  // Importers: Production / Imports / Ending Stocks, same layout
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — 10-Year Country Breakout</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('PRODUCTION', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'pr')));
  root.insertAdjacentHTML('beforeend', panelWrap('IMPORTS', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'im')));
  root.insertAdjacentHTML('beforeend', panelWrap('ENDING STOCKS', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'es')));
}

function initToggles(){
  const ct = document.getElementById('comm-toggle');
  ct.innerHTML = COMMS.map(c=>`<button class="tbtn${c===currentComm?' active':''}" data-c="${c}">${c==='Rapeseed/Canola'?'Canola':c}</button>`).join('');
  ct.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{
    currentComm = b.dataset.c;
    ct.querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('active', x===b));
    render();
  }));

  const ut = document.getElementById('unit-toggle');
  ut.querySelectorAll('.tbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.u===currentUnit);
    b.addEventListener('click', ()=>{
      currentUnit = b.dataset.u;
      ut.querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('active', x===b));
      render();
    });
  });
}

fetch('data/psd_data.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    DATA = data;
    document.getElementById('meta').textContent = 'Last updated: ' + (data._meta?.fetched_at || 'unknown');
    initToggles();
    render();
    usdaReady = true;
    if(typeof checkSummaryReady === 'function') checkSummaryReady();
  })
  .catch(e=>{
    document.getElementById('root').innerHTML = `<div id="err">Error loading data: ${e.message}</div>`;
  });
</script>

<script>
const CFTC_GROUPS = [
  {label:"Grains", codes:[
    {code:"002602", label:"Corn"},
    {code:"001602", label:"Wheat (Chicago SRW)"},
    {code:"001612", label:"Wheat (KC HRW)"},
    {code:"001626", label:"Wheat (Mpls Spring)"},
  ]},
  {label:"Oilseeds", codes:[
    {code:"135731", label:"Canola"},
    {code:"005602", label:"Soybeans"},
    {code:"007601", label:"Soybean Oil"},
    {code:"026603", label:"Soybean Meal"},
  ]},
  {label:"Meats", codes:[
    {code:"061641", label:"Feeder Cattle"},
    {code:"057642", label:"Live Cattle"},
    {code:"054642", label:"Lean Hogs"},
  ]},
  {label:"Softs", codes:[
    {code:"073732", label:"Cocoa"},
    {code:"083731", label:"Coffee"},
    {code:"033661", label:"Cotton"},
    {code:"080732", label:"Sugar"},
  ]},
  {label:"Energies", codes:[
    {code:"067651", label:"Crude Oil (WTI)"},
    {code:"022651", label:"Heating Oil"},
    {code:"111659", label:"RBOB Gasoline"},
    {code:"023651", label:"Natural Gas"},
  ]},
  {label:"Metals", codes:[
    {code:"088691", label:"Gold"},
    {code:"084691", label:"Silver"},
    {code:"085692", label:"Copper"},
  ]},
];

let CFTC_DATA = null;
let cftcLoaded = false;
let usdaReady = false;
let cftcReady = false;
let exportsReady = false;
function checkSummaryReady(){
  if(usdaReady && cftcReady && exportsReady && typeof renderSummary === 'function') renderSummary();
}

function cftcFmt(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : Math.round(v).toLocaleString(); }
function cftcPct(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : v.toFixed(1)+'%'; }
function cftcSignedPct(v, dec){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(dec===undefined?1:dec)+'%';
}
function cftcSignedNum(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+Math.round(v).toLocaleString();
}
function cftcOrdinal(n){
  const r = Math.round(n), mod100 = r%100;
  if(mod100>=11 && mod100<=13) return r+'th';
  switch(r%10){case 1:return r+'st';case 2:return r+'nd';case 3:return r+'rd';default:return r+'th';}
}

function computeRow(hist, i){
  const h = hist[i];
  const oi = h.oi, mmL = h.mm_long, mmS = h.mm_short;
  const net = (mmL!==null && mmS!==null) ? mmL-mmS : null;
  const netPctOi = (net!==null && oi) ? net/oi*100 : null;
  const grossLPctOi = (mmL!==null && oi) ? mmL/oi*100 : null;
  const grossSPctOi = (mmS!==null && oi) ? mmS/oi*100 : null;
  let weeklyChange = null;
  if(i>0){
    const prev = hist[i-1];
    if(prev.mm_long!==null && prev.mm_short!==null && mmL!==null && mmS!==null){
      weeklyChange = net - (prev.mm_long - prev.mm_short);
    }
  }
  return {oi, oiChg:h.oi_chg, mmL, mmS, net, netPctOi, grossLPctOi, grossSPctOi, weeklyChange};
}

function computeLatestMetrics(entry, hist){
  if(!hist || !hist.length) return null;
  const rows = hist.map((h,i)=>computeRow(hist,i));
  const latest = rows[rows.length-1];
  const netHistory = rows.map(r=>r.netPctOi).filter(v=>v!==null);
  const glHistory = rows.map(r=>r.grossLPctOi).filter(v=>v!==null);
  const gsHistory = rows.map(r=>r.grossSPctOi).filter(v=>v!==null);

  function pctileOf(v, arr){
    if(v===null || !arr.length) return null;
    return arr.filter(x=>x<=v).length/arr.length*100;
  }
  return {
    ...latest,
    netPctile: pctileOf(latest.netPctOi, netHistory),
    glPctile: pctileOf(latest.grossLPctOi, glHistory),
    gsPctile: pctileOf(latest.grossSPctOi, gsHistory),
  };
}

function extremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-hi';
  if(p<=10) return 'cftc-extreme-lo';
  return '';
}
// Net % of OI: high percentile = crowded long (flag red), low percentile = crowded short (flag green)
function netExtremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-lo';   // red
  if(p<=10) return 'cftc-extreme-hi';   // green
  return '';
}
// Gross long/short % of OI: only flag unusually LARGE positions, in yellow. Small positions aren't flagged.
function grossExtremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-yellow';
  return '';
}

const CFTC_COL_GROUPS = [
  {label:'Position', cols:['Net Position','Wkly Chg']},
  {label:'Net Exposure', cols:['Net % OI','Pctile']},
  {label:'Gross Positions', cols:['Gross Long','Gross Short']},
  {label:'Gross % of OI', cols:['Long % OI','Short % OI']},
  {label:'Open Interest', cols:['OI','OI Chg']},
];

function buildCftcRow(entry, hist){
  const m = computeLatestMetrics(entry, hist);
  let html = `<tr><td>${entry.label}</td>`;
  if(!m){
    html += `<td colspan="10" style="text-align:left;color:var(--text3)">No data (code ${entry.code})</td>`;
  } else {
    html += `<td class="${m.net>=0?'cftc-up':'cftc-dn'}">${cftcFmt(m.net)}</td>`;
    html += `<td class="${m.weeklyChange>=0?'cftc-up':'cftc-dn'}">${cftcSignedNum(m.weeklyChange)}</td>`;
    html += `<td class="${m.netPctOi>=0?'cftc-up':'cftc-dn'}">${cftcPct(m.netPctOi)}</td>`;
    html += `<td class="${netExtremeClass(m.netPctile)}">${m.netPctile===null?'—':cftcOrdinal(m.netPctile)}</td>`;
    html += `<td>${cftcFmt(m.mmL)}</td>`;
    html += `<td>${cftcFmt(m.mmS)}</td>`;
    html += `<td class="${grossExtremeClass(m.glPctile)}">${cftcPct(m.grossLPctOi)}</td>`;
    html += `<td class="${grossExtremeClass(m.gsPctile)}">${cftcPct(m.grossSPctOi)}</td>`;
    html += `<td>${cftcFmt(m.oi)}</td>`;
    html += `<td class="${m.oiChg>=0?'cftc-up':'cftc-dn'}">${cftcSignedNum(m.oiChg)}</td>`;
  }
  html += `</tr>`;
  return html;
}

function buildCftcMasterTable(){
  let html = `<table class="cftc-table"><thead>`;
  html += `<tr><th rowspan="2">Product</th>`;
  CFTC_COL_GROUPS.forEach(g=>{ html += `<th colspan="2" style="text-align:center;border-left:1px solid var(--border2);color:var(--amber);font-size:13px;letter-spacing:.08em">${g.label}</th>`; });
  html += `</tr><tr>`;
  CFTC_COL_GROUPS.forEach(g=>{
    g.cols.forEach((c,i)=>{ html += `<th${i===0?' style="border-left:1px solid var(--border2)"':''}>${c}</th>`; });
  });
  html += `</tr></thead><tbody>`;

  CFTC_GROUPS.forEach(group=>{
    html += `<tr class="cftc-row-section"><td colspan="11">${group.label}</td></tr>`;
    group.codes.forEach(entry=>{
      const hist = (CFTC_DATA.codes && CFTC_DATA.codes[entry.code]) ? CFTC_DATA.codes[entry.code].history : null;
      html += buildCftcRow(entry, hist);
    });
  });
  html += `</tbody></table>`;
  return html;
}

function renderCftc(){
  const root = document.getElementById('cftc-root');
  root.innerHTML = '';
  const yrs = CFTC_DATA._meta?.years_history;
  document.getElementById('cftc-meta').textContent = 'Last updated: ' + (CFTC_DATA._meta?.fetched_at || 'unknown');
  root.insertAdjacentHTML('beforeend', buildCftcMasterTable());
  root.insertAdjacentHTML('beforeend', `<div class="page-footnote">Managed Money (Fund) category — ${yrs ? yrs+'yr lookback' : ''} — highlighted cells are top/bottom 10% of that lookback window.</div>`);
}

function loadCftc(){
  if(cftcLoaded) return;
  cftcLoaded = true;
  fetch('data/cftc_data.json?_=' + Date.now())
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data=>{
      CFTC_DATA = data;
      renderCftc();
      cftcReady = true;
      checkSummaryReady();
    })
    .catch(e=>{
      document.getElementById('cftc-root').innerHTML = `<div id="cftc-err">Error loading CFTC data: ${e.message}</div>`;
      cftcLoaded = false;
    });
}
loadCftc();

// ---------------- SUMMARY PAGE ----------------

// Declared here (ahead of SUMMARY_ROWS below) since SUMMARY_ROWS references them directly
// at array-literal-evaluation time — a forward reference to a later `const` would throw.
const VEGOILS = ["Palm Oil", "Soybean Oil", "Rapeseed Oil", "Sunflower Oil"];
const VEGOIL_EXPORTERS = ["Indonesia", "Malaysia", "Argentina", "Brazil", "United States", "Canada", "European Union", "Ukraine", "Russia"];
const VEGOIL_IMPORTERS = ["India", "China", "Pakistan", "Bangladesh"];
const MEALS = ["Soybean Meal", "Rapeseed Meal", "Sunflower Meal"];
const MEAL_EXPORTERS = ["Argentina", "Brazil", "United States", "Canada", "European Union", "Ukraine", "Russia"];
const MEAL_IMPORTERS = ["European Union", "Indonesia", "Vietnam", "Philippines"];

const SUMMARY_ROWS = [
  {section:'Grains',   label:'Wheat (Chicago SRW)', cftcCode:'001602', usdaComm:'Wheat', domestic:'United States', seasonalName:'Chicago Wheat', exportName:'WHEAT - SOFT RED WINTER'},
  {section:'Grains',   label:'Wheat (KC HRW)',       cftcCode:'001612', usdaComm:'Wheat', domestic:'United States', seasonalName:'Kansas Wheat', exportName:'WHEAT - HARD RED WINTER'},
  {section:'Grains',   label:'Wheat (Mpls Spring)',  cftcCode:'001626', usdaComm:'Wheat', domestic:'United States', seasonalName:'Spring Wheat', exportName:'WHEAT - HARD RED SPRING'},
  {section:'Grains',   label:'Corn',                 cftcCode:'002602', usdaComm:'Corn', domestic:'United States', seasonalName:'Corn', exportName:'CORN - UNMILLED'},
  {section:'Oilseeds', label:'Soybeans',             cftcCode:'005602', usdaComm:'Soybeans', domestic:'United States', seasonalName:'Soybeans', exportName:'SOYBEANS'},
  {section:'Oilseeds', label:'Canola',               cftcCode:'135731', usdaComm:'Rapeseed/Canola', domestic:'Canada', seasonalName:'Canola Seed', exportName:null},
  // Vegoils: Seasonality/Positioning/Export Sales YoY use Soybean Oil (the only vegoil with a
  // tracked CFTC future, seasonal series, and US export data) as the representative instrument.
  // Production YoY and Stocks/Use % Rank are genuinely combined across all 4 tracked oils.
  {section:'Oilseeds', label:'Soyoil (Vegoils)',      cftcCode:'007601', usdaComm:null, domestic:'United States', seasonalName:'Soybean Oil', exportName:'SOYBEAN OIL', combinedList:VEGOILS, combinedExporters:VEGOIL_EXPORTERS, combinedImporters:VEGOIL_IMPORTERS},
  // Meal: Seasonality/Positioning/Export Sales use Soybean Meal (the dominant traded meal,
  // with a tracked CFTC future, seasonal series, and US export data — "SOYBEAN CAKE AND MEAL"
  // is the exact commodity name confirmed in the export sales feed). Production YoY and
  // Stocks/Use % Rank are genuinely combined across Soybean, Rapeseed, and Sunflower meal.

function summaryYearsSorted(usdaComm){
  const countries = DATA[usdaComm];
  if(!countries) return [];
  const allYears = new Set();
  Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>allYears.add(y)));
  return [...allYears].sort();
}

function summaryProdYoY(usdaComm, country){
  const countries = DATA[usdaComm];
  if(!countries || !countries[country]) return null;
  const years = summaryYearsSorted(usdaComm);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curRaw = countries[country][latest], prevRaw = countries[country][prev];
  const cur = (curRaw && curRaw.pr!==undefined) ? curRaw.pr : null;
  const pr0 = (prevRaw && prevRaw.pr!==undefined) ? prevRaw.pr : null;
  return yoyPct(cur, pr0);
}

function summaryProdYoYAgg(usdaComm, countryList){
  const countries = DATA[usdaComm];
  if(!countries || !countryList || !countryList.length) return null;
  const years = summaryYearsSorted(usdaComm);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumCountries(countries, countryList, latest);
  const prevAgg = sumCountries(countries, countryList, prev);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}

function summaryStuPctile(usdaComm, yearDataFn){
  const years = summaryYearsSorted(usdaComm);
  if(!years.length) return null;
  const hist = years.map(y=>getStu(yearDataFn(y))).filter(v=>v!==null);
  const latestYear = years[years.length-1];
  const v = getStu(yearDataFn(latestYear));
  if(v===null || !hist.length) return null;
  return hist.filter(x=>x<=v).length/hist.length*100;
}

// Vegoils-combined equivalents of the above — sum across all 4 tracked oils instead of one commodity.
function summaryProdYoYCombined(commList, country){
  const years = commodityGroupAllYears(commList);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m][country])?DATA[m][country][yr]:undefined, latest, commList);
  const prevAgg = sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m][country])?DATA[m][country][yr]:undefined, prev, commList);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}
function summaryProdYoYAggCombined(commList, countryList){
  const years = commodityGroupAllYears(commList);
  if(years.length<2 || !countryList || !countryList.length) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, countryList, yr), latest, commList);
  const prevAgg = sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, countryList, yr), prev, commList);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}
function summaryStuPctileCombined(commList, entityFn){
  const years = commodityGroupAllYears(commList);
  if(!years.length) return null;
  const hist = years.map(y=>getStu(sumAcrossOils(entityFn, y, commList))).filter(v=>v!==null);
  const latestYear = years[years.length-1];
  const v = getStu(sumAcrossOils(entityFn, latestYear, commList));
  if(v===null || !hist.length) return null;
  return hist.filter(x=>x<=v).length/hist.length*100;
}

function summaryPctileClass(p){
  if(p===null || p===undefined) return '';
  if(p<=25) return 'pctile-tight';
  if(p>=75) return 'pctile-loose';
  return 'pctile-mid';
}

function summaryPctileText(p){ return p===null||p===undefined ? '—' : cftcOrdinal(p); }

function getNextSeasonalEntry(productName){
  if(typeof SEASONALS_WEEKS === 'undefined' || typeof SEASONALS_DATA === 'undefined') return null;
  const vals = SEASONALS_DATA[productName];
  if(!vals) return null;
  const monthMap = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const today = new Date(); today.setHours(0,0,0,0);
  const year = today.getFullYear();
  // Picks the most recent week whose start date is on or before today — i.e. the
  // currently-active weekly period, not the upcoming one. E.g. if today is Sep 15
  // and the labeled weeks are "Sep 14" / "Sep 21", this returns "Sep 14" since
  // today falls inside that week's Sep 14–20 span.
  let best = null;
  SEASONALS_WEEKS.forEach((w,i)=>{
    const parts = w.split(' ');
    const d = new Date(year, monthMap[parts[0]], parseInt(parts[1],10));
    if(d<=today && (best===null || d>best.date)){
      best = {date:d, label:w, value:vals[i]};
    }
  });
  return best;
}

function buildSummaryTable(){
  const groups = [
    {label:'Seasonality', cols:[{l:'This Wk', w:70}]},
    {label:'Positioning', cols:[{l:'Net % OI', w:80}, {l:'Pctile', w:66}]},
    {label:'Production YoY', cols:[{l:'Domestic', w:85}, {l:'Exporters', w:85}]},
    {label:'Export Sales YoY', cols:[{l:'Total Commit.', w:100}]},
    {label:'Stocks/Use % Rank', cols:[{l:'Domestic', w:85}, {l:'World', w:75}, {l:'Exporters', w:85}, {l:'Importers', w:85}]},
  ];
  const totalCols = 1 + groups.reduce((sum,g)=>sum+g.cols.length,0);
  const productWidth = 228; // matches crop calendar's Origin column width, so both tables align

  let html = `<table class="summary-table"><colgroup><col style="width:${productWidth}px">`;
  groups.forEach(g=>{ g.cols.forEach(c=>{ html += `<col style="width:${c.w}px">`; }); });
  html += `</colgroup><thead><tr><th rowspan="2">Product</th>`;
  groups.forEach(g=>{ html += `<th colspan="${g.cols.length}" style="text-align:center;border-left:1px solid var(--border2);color:var(--amber);font-size:13px;letter-spacing:.08em">${g.label}</th>`; });
  html += `</tr><tr>`;
  groups.forEach(g=>{
    g.cols.forEach((c,i)=>{ html += `<th${i===0?' style="border-left:1px solid var(--border2)"':''}>${c.l}</th>`; });
  });
  html += `</tr></thead><tbody>`;

  let curSection = null;
  SUMMARY_ROWS.forEach(row=>{
    if(row.section !== curSection){
      curSection = row.section;
      html += `<tr class="cftc-row-section"><td colspan="${totalCols}">${curSection}</td></tr>`;
    }

    const countries = DATA[row.usdaComm] || {};
    const expList = row.combinedList ? row.combinedExporters : (EXPORTERS[row.usdaComm]||[]).filter(c=>countries[c]);
    const impList = row.combinedList ? row.combinedImporters : (IMPORTERS[row.usdaComm]||[]).filter(c=>countries[c]);

    // Seasonality (next upcoming week)
    const seas = getNextSeasonalEntry(row.seasonalName);

    // Positioning (CFTC)
    const hist = (CFTC_DATA.codes && CFTC_DATA.codes[row.cftcCode]) ? CFTC_DATA.codes[row.cftcCode].history : null;
    const m = computeLatestMetrics({code:row.cftcCode, label:row.label}, hist);

    // Fundamentals
    let domesticYoY, exportersYoY, domesticStu, worldStu, expStu, impStu;
    if(row.combinedList){
      domesticYoY = summaryProdYoYCombined(row.combinedList, row.domestic);
      exportersYoY = summaryProdYoYAggCombined(row.combinedList, expList);
      domesticStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>(DATA[cm]&&DATA[cm][row.domestic])?DATA[cm][row.domestic][yr]:undefined);
      worldStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>(DATA[cm]&&DATA[cm]['World'])?DATA[cm]['World'][yr]:undefined);
      expStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>sumCountries(DATA[cm]||{}, expList, yr));
      impStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>sumCountries(DATA[cm]||{}, impList, yr));
    } else {
      domesticYoY = summaryProdYoY(row.usdaComm, row.domestic);
      exportersYoY = summaryProdYoYAgg(row.usdaComm, expList);
      domesticStu = summaryStuPctile(row.usdaComm, y=>(countries[row.domestic]||{})[y]);
      worldStu = summaryStuPctile(row.usdaComm, y=>(countries['World']||{})[y]);
      expStu = summaryStuPctile(row.usdaComm, y=>sumCountries(countries, expList, y));
      impStu = summaryStuPctile(row.usdaComm, y=>sumCountries(countries, impList, y));
    }

    // Export Sales — Total Commitment YoY
    let totalCommitYoY = null;
    if(row.exportName && EXPORTS_DATA && EXPORTS_DATA.commodities && EXPORTS_DATA.commodities[row.exportName]){
      const t = EXPORTS_DATA.commodities[row.exportName].total;
      if(t) totalCommitYoY = t.yoy_total_commitment_pct;
    }

    html += `<tr><td>${row.label}</td>`;
    if(!seas){
      html += `<td style="color:var(--text3)">—</td>`;
    } else {
      const text = (seas.value>0?'+':'')+seas.value;
      html += `<td style="background:${seasonalColor(seas.value)};color:#111;font-weight:800" title="Week of ${seas.label}">${text}</td>`;
    }
    if(!m){
      html += `<td colspan="2" style="text-align:left;color:var(--text3)">No CFTC data</td>`;
    } else {
      html += `<td class="${m.netPctOi>=0?'cftc-up':'cftc-dn'}">${cftcPct(m.netPctOi)}</td>`;
      html += `<td class="${netExtremeClass(m.netPctile)}">${m.netPctile===null?'—':cftcOrdinal(m.netPctile)}</td>`;
    }
    html += `<td class="${domesticYoY>=0?'cftc-up':'cftc-dn'}">${cftcSignedPct(domesticYoY,1)}</td>`;
    html += `<td class="${exportersYoY>=0?'cftc-up':'cftc-dn'}">${cftcSignedPct(exportersYoY,1)}</td>`;
    html += `<td class="${totalCommitYoY>=0?'cftc-up':'cftc-dn'}">${totalCommitYoY===null?'—':cftcSignedPct(totalCommitYoY,1)}</td>`;
    html += `<td class="${summaryPctileClass(domesticStu)}">${summaryPctileText(domesticStu)}</td>`;
    html += `<td class="${summaryPctileClass(worldStu)}">${summaryPctileText(worldStu)}</td>`;
    html += `<td class="${summaryPctileClass(expStu)}">${summaryPctileText(expStu)}</td>`;
    html += `<td class="${summaryPctileClass(impStu)}">${summaryPctileText(impStu)}</td>`;
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

function buildCropCalendarTable(){
  const curMonth = new Date().getMonth() + 1; // 1-12

  let html = `<table class="cal-table"><colgroup><col style="width:228px">`;
  CAL_MONTHS.forEach(()=>{ html += `<col style="width:68px">`; });
  html += `</colgroup><thead><tr><th style="text-align:left">Origin</th>`;
  CAL_MONTHS.forEach((m,i)=>{
    const isCur = (i+1)===curMonth;
    html += `<th class="${isCur?'cal-cur-month':''}">${m}</th>`;
  });
  html += `</tr></thead><tbody>`;

  let curSection = null;
  CROP_CALENDAR.forEach(row=>{
    if(row.section !== curSection){
      curSection = row.section;
      html += `<tr class="cftc-row-section"><td colspan="13">${curSection}</td></tr>`;
    }
    html += `<tr><td>${row.origin}</td>`;
    for(let m=1; m<=12; m++){
      const isPlant = row.plant.includes(m);
      const isHarvest = row.harvest.includes(m);
      const isCur = m===curMonth;
      let bg = 'transparent', label = '';
      if(isPlant && isHarvest){ bg = 'linear-gradient(135deg, rgba(46,143,82,.35) 50%, rgba(230,180,20,.4) 50%)'; label = 'P/H'; }
      else if(isPlant){ bg = 'rgba(46,143,82,.30)'; label = 'P'; }
      else if(isHarvest){ bg = 'rgba(230,180,20,.40)'; label = 'H'; }
      const curCls = isCur ? ' cal-cur-month' : '';
      html += `<td class="${curCls}" style="background:${bg};color:var(--text);font-weight:700">${label}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

    ' — CFTC: ' + (CFTC_DATA._meta?.fetched_at || 'unknown') +
    ' — Exports: ' + (EXPORTS_DATA && EXPORTS_DATA._meta?.fetched_at || 'unavailable');
  root.insertAdjacentHTML('beforeend', buildSummaryTable());

  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin:28px 0 0">Crop Calendar — Major Origins</div>`);

  root.insertAdjacentHTML('beforeend', `<div class="page-footnote">Domestic column uses United States, except Canola which uses Canada — Canola has no US export data. Soyoil (Vegoils) row uses Soybean Oil for Seasonality, Positioning, and Export Sales columns (the only tracked vegoil with a CFTC future, seasonal series, and US export data); Production YoY and Stocks/Use % Rank are genuinely combined across Palm, Soybean, Rapeseed, and Sunflower oil. Soymeal (Meal) row uses Soybean Meal the same way; Production YoY and Stocks/Use % Rank are combined across Soybean, Rapeseed, and Sunflower meal. Cotton's Export Sales YoY column reads the "COTTON" key from export sales data — if that key doesn't exactly match what USDA's export sales report uses, the cell will show "—" until confirmed.</div>`);

  // Force the calendar to exactly match the summary table's actual rendered width,
  // rather than relying on both tables' independent width math staying in sync.
  requestAnimationFrame(()=>{
    const summaryTable = root.querySelector('.summary-table');

    if(summaryTable && calTable){
      const w = summaryTable.getBoundingClientRect().width;
      calTable.style.width = w + 'px';
    }
  });
}

  'Cattle': [1,-1,3,4,2,1,-2,-5,1,4,-1,-1,0,0,-5,0,2,1,1,-4,-4,-3,5,-1,5,1,4,1,-1,5,-1,-4,-4,2,-3,1,4,4,2,-1,-1,0,-1,-2,-3,-4,-1],
  'Hogs': [-1,3,1,4,1,2,-1,4,1,1,3,0,-2,-3,0,2,0,-1,3,-4,3,2,1,4,5,4,-5,-4,-2,-1,2,5,2,2,4,4,4,4,-1,-3,3,-1,-2,-2,-3,-3,-1],
  'Feeder Cattle': [3,1,1,-2,-1,-1,-4,-1,0,2,4,-3,2,1,-4,1,3,2,4,-5,-4,4,4,4,2,4,3,-1,-4,2,0,2,4,-3,3,-4,4,4,2,4,-1,-2,-5,4,2,-1,-1],
  'Cotton': [1,1,3,1,1,-3,-1,-1,-1,-3,-4,-4,-1,-5,-2,-2,-2,2,1,-4,0,-5,-3,-2,-4,-4,-1,1,-3,3,-2,2,1,1,4,1,5,5,1,1,-2,-2,-3,-1,-1,-1,0],

  'NY Cocoa': [2,1,3,-1,-1,-1,4,5,1,-1,-1,4,-2,4,5,5,1,2,-1,-3,1,-5,-3,-3,-5,-1,5,-1,-2,-4,-3,-1,5,-1,-1,2,-2,2,-2,-3,-3,4,-2,5,5,3,-3],
  'London Cocoa': [-3,1,1,-2,-1,4,-3,-1,-1,1,-3,4,2,-2,-3,1,-1,4,2,4,4,-4,-3,-1,0,2,-2,4,-4,1,-3,1,-1,-3,-1,-3,2,-1,-4,1,-3,-5,-3,2,3,4,4],
};

function seasonalColor(v){
  if(v===null||v===undefined) return '#fff';
  const t = Math.min(Math.abs(v),5)/5;
  if(v>=0){
    const r = Math.round(255+(46-255)*t), g = Math.round(255+(143-255)*t), b = Math.round(255+(82-255)*t);
    return `rgb(${r},${g},${b})`;
  } else {
    const r = Math.round(255+(184-255)*t), g = Math.round(255+(56-255)*t), b = Math.round(255+(56-255)*t);
    return `rgb(${r},${g},${b})`;
  }
}

let seasonalsMonth = null;

function getSeasonalsMonths(){
  const months = [];
  SEASONALS_WEEKS.forEach(w=>{ const m=w.split(' ')[0]; if(!months.includes(m)) months.push(m); });
  return months;
}

function defaultSeasonalsMonth(){
  const months = getSeasonalsMonths();
  const nowAbbr = new Date().toLocaleString('en-US',{month:'short'});
  return months.includes(nowAbbr) ? nowAbbr : months[0];
}

function buildSeasonalsTable(startMonth){
  const months = getSeasonalsMonths();
  const startIdx = months.indexOf(startMonth);
  const windowMonths = months.slice(startIdx, startIdx+3); // rolling quarter: selected month + next 2
  const cols = SEASONALS_WEEKS.map((w,i)=>({w,i})).filter(o=>windowMonths.includes(o.w.split(' ')[0]));

  let html = `<table class="seas-table"><thead><tr><th class="seas-label-h">Product</th>`;
  cols.forEach(o=>{ html += `<th>${o.w}</th>`; });
  html += `</tr></thead><tbody>`;

  SEASONALS_SECTIONS.forEach(section=>{
    html += `<tr class="seas-section-row"><td colspan="${cols.length+1}">${section.label}</td></tr>`;
    section.products.forEach(p=>{
      const vals = SEASONALS_DATA[p] || [];
      html += `<tr><td class="seas-label">${p}</td>`;
      cols.forEach(o=>{
        const v = vals[o.i];
        const text = (v===null||v===undefined) ? '—' : (v>0?'+':'')+v;
        html += `<td style="background:${seasonalColor(v)}">${text}</td>`;
      });
      html += `</tr>`;
    });
  });
  html += `</tbody></table>`;
  return html;
}

function renderSeasonals(){
  if(!seasonalsMonth) seasonalsMonth = defaultSeasonalsMonth();
  const months = getSeasonalsMonths();
  const root = document.getElementById('seasonals-root');
  let selHtml = `<div class="toggle" style="margin-bottom:16px;display:inline-flex">`;
  months.forEach(m=>{
    selHtml += `<button class="tbtn seas-month-btn${m===seasonalsMonth?' active':''}" data-m="${m}">${m}</button>`;
  });
  selHtml += `</div><div style="font-size:12px;color:var(--text3);margin-bottom:10px">Showing ${seasonalsMonth} through the following 2 months</div>`;
  root.innerHTML = selHtml + buildSeasonalsTable(seasonalsMonth) + `<div class="page-footnote">Forward-looking weekly seasonal score (-5 to +5), 15-year lookback. Static — manually entered, not auto-updating.</div>`;
  root.querySelectorAll('.seas-month-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ seasonalsMonth = b.dataset.m; renderSeasonals(); });
  });
}
renderSeasonals();
</script>

<style>
.exp-table{width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.exp-table th{background:var(--th-bg);padding:7px 4px;text-align:right;font-size:12.5px;font-weight:900;letter-spacing:.03em;color:var(--text);border-bottom:2px solid var(--border2);white-space:nowrap;overflow:hidden}
.exp-table th:first-child{text-align:left;width:20%}
.exp-table td{padding:4px 4px;text-align:right;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg);overflow:hidden;text-overflow:ellipsis}
.exp-table td:first-child{text-align:left;color:var(--text);font-weight:700}
.exp-row-section td{background:var(--section-bg);color:var(--amber) !important;font-size:13px !important;font-weight:900 !important;letter-spacing:.16em;text-transform:uppercase;padding:8px 10px 6px;border-top:2px solid var(--amber)}
#exports-err{padding:40px;text-align:center;color:var(--red);font-size:14px}
</style>
<script>
let EXPORTS_DATA = null;
let exportsCommodity = null;

function expFmt(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : Math.round(v).toLocaleString(); }
function expSignedPct(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(1)+'%';
}

function buildExportsSummaryTable(){
  const cols = [
    {label:'Net Sales (Wk)'},
    {label:'Outstanding Sales'},
    {label:'Accum. Exports (YTD)'},
    {label:'Total Commitment'},
    {label:'Accum. Exports YoY'},
    {label:'Total Commitment YoY'},
  ];
  let html = `<table class="exp-table"><thead><tr><th>Commodity</th>`;
  cols.forEach(c=>{ html += `<th>${c.label}</th>`; });
  html += `</tr></thead><tbody>`;

  const commodities = EXPORTS_DATA.commodities || {};
  Object.keys(commodities).forEach(commName=>{
    const t = commodities[commName].total;
    if(!t) return;
    html += `<tr><td>${commName}</td>`;
    html += `<td class="${t.net_sales>=0?'cftc-up':'cftc-dn'}">${expFmt(t.net_sales)}</td>`;
    html += `<td>${expFmt(t.outstanding_sales)}</td>`;
    html += `<td>${expFmt(t.accumulated_exports)}</td>`;
    html += `<td>${expFmt(t.total_commitment)}</td>`;
    html += `<td class="${t.yoy_accum_exports_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(t.yoy_accum_exports_pct)}</td>`;
    html += `<td class="${t.yoy_total_commitment_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(t.yoy_total_commitment_pct)}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function buildExportsCountryTable(commName){
  const cols = [
    {label:'Net Sales (Wk)'},
    {label:'Outstanding Sales'},
    {label:'Accum. Exports (YTD)'},
    {label:'Total Commitment'},
    {label:'Accum. Exports YoY'},
    {label:'Total Commitment YoY'},
  ];
  let html = `<table class="exp-table"><thead><tr><th>Country</th>`;
  cols.forEach(c=>{ html += `<th>${c.label}</th>`; });
  html += `</tr></thead><tbody>`;

  const comm = (EXPORTS_DATA.commodities || {})[commName];
  const countries = comm ? (comm.countries || {}) : {};
  const countryNames = Object.keys(countries)
    .sort((a,b) => (countries[b].accumulated_exports||0) - (countries[a].accumulated_exports||0));

  if(!countryNames.length){
    html += `<tr><td colspan="${cols.length+1}" style="color:var(--text3)">No country data</td></tr>`;
  } else {
    countryNames.forEach(cName=>{
      const d = countries[cName];
      html += `<tr><td>${cName}</td>`;
      html += `<td class="${d.net_sales>=0?'cftc-up':'cftc-dn'}">${expFmt(d.net_sales)}</td>`;
      html += `<td>${expFmt(d.outstanding_sales)}</td>`;
      html += `<td>${expFmt(d.accumulated_exports)}</td>`;
      html += `<td>${expFmt(d.total_commitment)}</td>`;
      html += `<td class="${d.yoy_accum_exports_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(d.yoy_accum_exports_pct)}</td>`;
      html += `<td class="${d.yoy_total_commitment_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(d.yoy_total_commitment_pct)}</td>`;
      html += `</tr>`;
    });
  }
  html += `</tbody></table>`;
  return html;
}

function renderExports(){
  const root = document.getElementById('exports-root');
  root.innerHTML = '';
  document.getElementById('exports-meta').textContent = 'Last updated: ' + (EXPORTS_DATA._meta?.fetched_at || 'unknown');

  const commodities = Object.keys(EXPORTS_DATA.commodities || {});
  if(!exportsCommodity || !commodities.includes(exportsCommodity)){
    exportsCommodity = commodities[0];
  }

  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin-bottom:0">Commodity Summary — YTD vs Prior Year</div>`);
  root.insertAdjacentHTML('beforeend', buildExportsSummaryTable());

  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin:24px 0 0">By Country — Largest to Smallest</div>`);

  const selWrap = document.createElement('div');
  selWrap.style.margin = '14px 0';
  selWrap.className = 'toggle';
  selWrap.style.display = 'inline-flex';
  selWrap.style.flexWrap = 'wrap';
  commodities.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'tbtn exp-comm-btn' + (c===exportsCommodity ? ' active' : '');
    btn.dataset.c = c;
    btn.textContent = c;
    btn.addEventListener('click', ()=>{ exportsCommodity = c; renderExports(); });
    selWrap.appendChild(btn);
  });
  root.appendChild(selWrap);

  root.insertAdjacentHTML('beforeend', buildExportsCountryTable(exportsCommodity));
  root.insertAdjacentHTML('beforeend', `<div class="page-footnote">Figures in metric tons — current marketing year only (excludes forward sales already booked against next marketing year). Net Sales — new sales this week, net of cancellations. Outstanding Sales — sold but not yet shipped. Accum. Exports (YTD) — shipped so far this marketing year. Total Commitment — Accum. Exports + Outstanding Sales.</div>`);
}

fetch('data/export_sales.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    EXPORTS_DATA = data;
    renderExports();
    exportsReady = true;
    checkSummaryReady();
  })
  .catch(e=>{
    document.getElementById('exports-root').innerHTML = `<div id="exports-err">Error loading export sales data: ${e.message}</div>`;
    exportsReady = true; // don't block the Summary tab forever if this one source fails
    checkSummaryReady();
  });
</script>

<style>
.oil-table{width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.oil-table th{background:var(--th-bg);padding:8px 10px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}

.oil-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.oil-table th.yoy{color:var(--text3);font-style:italic}
.oil-table td{padding:5px 10px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.oil-table td:first-child{text-align:left;color:var(--text);font-weight:700}
#vegoils-err{padding:40px;text-align:center;color:var(--red);font-size:14px}
</style>
<script>
const VEGOIL_PANELS = [
  {oil:"Palm Oil",       country:"Indonesia"},
  {oil:"Palm Oil",       country:"Malaysia"},
  {oil:"Soybean Oil",    country:"Argentina"},
  {oil:"Soybean Oil",    country:"Brazil"},
  {oil:"Soybean Oil",    country:"United States"},
  {oil:"Rapeseed Oil",   country:"Canada"},
  {oil:"Rapeseed Oil",   country:"European Union"},
  {oil:"Sunflower Oil",  country:"Ukraine"},
  {oil:"Sunflower Oil",  country:"Russia"},
];
const VEGOIL_HIST_YEARS = 7;

function commodityGroupAllYears(commList){
  const years = new Set();
  commList.forEach(oil=>{
    const countries = DATA[oil];
    if(!countries) return;
    Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>years.add(y)));
  });
  return [...years].sort();
}
function vegoilAllYears(){ return commodityGroupAllYears(VEGOILS); }

// Sums a given "entity" (e.g. World, or a country/aggregate) across all 4 oils for one year.
// entityFn(oil, year) must return the raw {bs,pr,im,dc,ex,es} object (or null/undefined).
function sumAcrossOils(entityFn, year, commList){
  const list = commList || VEGOILS;
  const keys = ['bs','pr','im','dc','ex','es'];
  const out = {}; let any = false;
  keys.forEach(k=>{
    let s = 0, has = false;
    list.forEach(oil=>{
      const yd = entityFn(oil, year);
      const v = yd ? yd[k] : undefined;
      if(v !== undefined && !isNaN(v)){ s += v; has = true; any = true; }
    });
    out[k] = has ? s : undefined;
  });
  return any ? out : null;
}

function buildOilBalanceTable(yearDataFn, years, includeYoy, allYearsFull){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;
  const fullYears = allYearsFull || years;
  const stuHistory = fullYears.map(y => getStu(yearDataFn(y))).filter(v => v!==null);
  function stuPctile(y){
    const v = getStu(yearDataFn(y));
    if(v===null || stuHistory.length===0) return null;
    const countLE = stuHistory.filter(x => x<=v).length;
    return (countLE/stuHistory.length)*100;
  }

  const ROWS = [
    {type:'section', label:'Supply'},
    {type:'row', key:'bs', label:'Beginning stocks'},
    {type:'row', key:'pr', label:'Production'},
    {type:'row', key:'im', label:'Imports'},
    {type:'total', keys:['bs','pr','im'], label:'Total supply'},
    {type:'section', label:'Use'},
    {type:'row', key:'dc', label:'Dom. consumption'},
    {type:'row', key:'ex', label:'Exports'},
    {type:'total', keys:['dc','ex'], label:'Total demand'},
    {type:'section', label:'Balance'},
    {type:'row', key:'es', label:'Ending stocks', cls:'row-ending'},
    {type:'stu', label:'Stocks / Use %', cls:'row-stu'},
    {type:'stu_pctile', label:'S/U Percentile Rank (' + fullYears.length + 'yr hist)', cls:'row-pctile'},
  ];

  function displayVal(row, y){
    const yd = yearDataFn(y);
    if(row.type==='total') return getTotalRaw(yd, row.keys);
    if(row.type==='stu') return getStu(yd);
    if(row.type==='stu_pctile') return stuPctile(y);
    return getRaw(yd, row.key);
  }

  let html = `<div class="tbl-wrap"><table class="oil-table"><colgroup><col style="width:190px">`;
  years.forEach(()=>{ html += '<col>'; });
  if(includeYoy) html += '<col style="width:75px">';
  html += `</colgroup><thead><tr><th>ITEM</th>`;
  years.forEach(y=>{ html += `<th class="${y===latestYear?'latest':''}">${y}</th>`; });
  if(includeYoy) html += `<th class="yoy">YoY Δ</th>`;
  html += `</tr></thead><tbody>`;

  let alt = false;
  ROWS.forEach(row=>{
    if(row.type==='section'){
      html += `<tr class="row-section"><td colspan="${years.length+1+(includeYoy?1:0)}">${row.label}</td></tr>`;
      alt = false; return;
    }
    const cls = [row.cls||'', alt?'row-alt':''].filter(Boolean).join(' ');
    html += `<tr class="${cls}"><td>${row.label}</td>`;
    alt = !alt;
    const vals = years.map(y=>displayVal(row,y));
    for(let i=0;i<years.length;i++){
      const v = vals[i], prev = i>0?vals[i-1]:null;
      let tdCls = years[i]===latestYear ? 'latest' : '';
      if(row.type!=='stu' && row.type!=='stu_pctile' && v!==null && prev!==null){
        if(v>prev) tdCls += ' up'; else if(v<prev) tdCls += ' dn';
      }
      if(row.type==='stu_pctile' && v!==null){
        tdCls += v<=25 ? ' pctile-tight' : (v>=75 ? ' pctile-loose' : ' pctile-mid');
      }
      const text = row.type==='stu' ? fmtStu(v) : (row.type==='stu_pctile' ? (v===null?'—':ordinal(v)) : fmt(v));
      html += `<td class="${tdCls.trim()}">${text}</td>`;
    }
    if(includeYoy){
      const cur = displayVal(row, latestYear);
      const prev = prevYear ? displayVal(row, prevYear) : null;
      if(row.type==='stu_pctile'){
        html += `<td class="latest">—</td>`;
      } else {
        const yoy = row.type==='stu' ? (cur!==null&&prev!==null?cur-prev:null) : yoyPct(cur,prev);
        let cls = 'latest';
        if(yoy!==null){ cls += yoy>0?' up':(yoy<0?' dn':''); }
        const text = row.type==='stu' ? (yoy===null?'—':(yoy>=0?'+':'')+yoy.toFixed(1)+'pp') : fmtYoy(yoy);
        html += `<td class="${cls}">${text}</td>`;
      }
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function vegoilPanelWrap(title, sub, innerHtml){
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span><span class="panel-sub">${sub}</span></div>${innerHtml}</div>`;
}

function renderVegoilsInto(root){
  const yearsAll = vegoilAllYears();
  const years7 = yearsAll.slice(-VEGOIL_HIST_YEARS);
  if(!years7.length){ root.innerHTML = '<div id="vegoils-err">No vegetable oil data available — has the fetcher picked up Oil, Palm / Oil, Soybean / Oil, Rapeseed / Oil, Sunflowerseed yet?</div>'; return; }

  // World — combined across all 4 oils
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — Vegetable Oils (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('WORLD', '1000 MT — Palm + Soybean + Rapeseed + Sunflower',
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>(DATA[oil]&&DATA[oil]['World'])?DATA[oil]['World'][yr]:undefined, y), years7, true, yearsAll)));

  // Major Exporters — combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR EXPORTERS', VEGOIL_EXPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>sumCountries(DATA[oil]||{}, VEGOIL_EXPORTERS, yr), y), years7, true, yearsAll)));

  // Major Importers — combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR IMPORTERS', VEGOIL_IMPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>sumCountries(DATA[oil]||{}, VEGOIL_IMPORTERS, yr), y), years7, true, yearsAll)));

  // Individual oil/country panels — single oil each, not combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Individual Exporters — By Oil</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  VEGOIL_PANELS.forEach(p=>{
    const countries = DATA[p.oil] || {};
    const oilYears = (()=>{ const ys=new Set(); Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>ys.add(y))); return [...ys].sort(); })();
    const oilYears7 = oilYears.slice(-VEGOIL_HIST_YEARS);
    if(!oilYears7.length) return;
    stack.insertAdjacentHTML('beforeend', vegoilPanelWrap(`${p.country.toUpperCase()} — ${p.oil.toUpperCase()}`, '1000 MT',
      buildOilBalanceTable(y=>(countries[p.country]||{})[y], oilYears7, true, oilYears)));
  });
  root.appendChild(stack);
}

// ---------------- MEAL COMPLEX (Soybean / Rapeseed / Sunflower meal) ----------------
const MEAL_PANELS = [
  {oil:"Soybean Meal",    country:"Argentina"},
  {oil:"Soybean Meal",    country:"Brazil"},
  {oil:"Soybean Meal",    country:"United States"},
  {oil:"Rapeseed Meal",   country:"Canada"},
  {oil:"Rapeseed Meal",   country:"European Union"},
  {oil:"Sunflower Meal",  country:"Ukraine"},
  {oil:"Sunflower Meal",  country:"Russia"},
];
const MEAL_HIST_YEARS = 7;

function renderMealInto(root){
  const yearsAll = commodityGroupAllYears(MEALS);
  const years7 = yearsAll.slice(-MEAL_HIST_YEARS);
  if(!years7.length){ root.innerHTML = '<div id="vegoils-err">No meal data available — has the fetcher picked up Meal, Soybean / Meal, Rapeseed / Meal, Sunflowerseed yet?</div>'; return; }

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — Meal (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('WORLD', '1000 MT — Soybean + Rapeseed + Sunflower meal',
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m]['World'])?DATA[m]['World'][yr]:undefined, y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR EXPORTERS', MEAL_EXPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, MEAL_EXPORTERS, yr), y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR IMPORTERS', MEAL_IMPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, MEAL_IMPORTERS, yr), y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Individual Exporters — By Meal</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  MEAL_PANELS.forEach(p=>{
    const countries = DATA[p.oil] || {};
    const mealYears = commodityGroupAllYears([p.oil]);
    const mealYears7 = mealYears.slice(-MEAL_HIST_YEARS);
    if(!mealYears7.length) return;
    stack.insertAdjacentHTML('beforeend', vegoilPanelWrap(`${p.country.toUpperCase()} — ${p.oil.toUpperCase()}`, '1000 MT',
      buildOilBalanceTable(y=>(countries[p.country]||{})[y], mealYears7, true, mealYears)));
  });
  root.appendChild(stack);
}
