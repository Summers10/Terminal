name: Fetch PSD, CFTC, Export Sales, and Weather Data
 
on:
  schedule:
    - cron: '0 13 * * *'      # daily 13:00 UTC — PSD/WASDE updates monthly, daily is plenty
    - cron: '30 21 * * 5'     # Fridays 21:30 UTC (4:30pm ET) — after CFTC's 3:30pm ET COT release
    - cron: '0 14 * * 4'      # Thursdays 14:00 UTC (~9am ET) — after USDA's 8:30am ET export sales release
    - cron: '0 11 * * *'      # daily 11:00 UTC — ~6am Central (CDT, UTC-5). Shifts to ~5am once
                               # Central reverts to CST (UTC-6) in Nov; adjust to '0 12 * * *' then if exact 6am matters.
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab
 
permissions:
  contents: write
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Run PSD fetcher
        run: python scripts/fetch_psd.py
 
      - name: Run CFTC fetcher
        run: python scripts/fetch_cftc.py
 
      - name: Run Export Sales fetcher
        run: python scripts/fetch_exports.py
 
      - name: Run Weather fetcher
        run: python scripts/fetch_weather.py
 
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/psd_data.json data/cftc_data.json data/export_sales.json data/weather_data.json
          git diff --staged --quiet || git commit -m "Update PSD/CFTC/Export Sales/Weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
 
