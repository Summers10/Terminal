name: Fetch PSD, CFTC, Export Sales, and Weather Data
 
on:
  schedule:
    # One fetcher, several runs a day, each timed just after a release so data lands the same day. Times are UTC and
    # deliberately off the hour (GitHub delays scheduled runs at :00). Every run does the same thing (fetch all sources,
    # commit what changed), so a run that finds nothing new is harmless. Clock-change safe: each time is after its
    # release in both summer (EDT) and winter (EST).
    - cron: '7 11 * * *'        # daily ~6am Central — morning run (the only run on weekends, and the catch-up for anything missed)
    - cron: '7 14 * * 1-5'      # weekdays 10:07 EDT / 9:07 EST — after the 8:30 ET Export Sales release (Thursdays; Fridays if holiday-delayed)
    - cron: '17 18 * * 1-5'     # weekdays 2:17 EDT / 1:17 EST — after the ~noon ET WASDE (+1h for USDA's PSD to update)
    - cron: '47 20 * * 1-5'     # weekdays 4:47 EDT / 3:47 EST — after the 3:30 ET CFTC release (Fridays; Mondays if holiday-delayed)
  workflow_dispatch: {}          # lets you trigger it manually from the Actions tab (also forces a fresh weather pull)
 
permissions:
  contents: write
 
# One run at a time: a second trigger (manual run, or two crons close together) waits for the first to finish
# instead of racing it to push, which is what made the last push get rejected.
concurrency:
  group: fetch-data
  cancel-in-progress: false
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: fetch_psd.py reads the previous WASDE's numbers from earlier commits of psd_data.json
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      # Each fetcher is allowed to fail without stopping the others: whatever succeeded still gets saved below, and the
      # run is marked failed at the very end so you still see red. (A failed fetcher leaves its data file untouched.)
      - name: Run PSD fetcher
        id: psd
        continue-on-error: true
        run: python scripts/fetch_psd.py
 
      - name: Run CFTC fetcher
        id: cftc
        continue-on-error: true
        run: python scripts/fetch_cftc.py
 
      - name: Run Export Sales fetcher
        id: exports
        continue-on-error: true
        run: python scripts/fetch_exports.py
 
      - name: Run Weather fetcher
        id: weather
        continue-on-error: true
        env:
          # Scheduled runs skip the weather pull if the saved data is under 20h old (keeps Open-Meteo usage to ~1 pull/day);
          # a manual run forces a fresh one.
          WEATHER_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/fetch_weather.py
 
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/psd_data.json data/cftc_data.json data/export_sales.json data/export_sales_history.json data/weather_data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Update PSD/CFTC/Export Sales/Weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # This job takes minutes, so someone else may have pushed to main meanwhile (e.g. you uploading a file).
          # Rebase this run's commit on top of theirs and retry. In a rebase, "-X theirs" means "prefer the commit
          # being replayed" = this run's freshly fetched data, so a clash on a data file is resolved in favour of the new data.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed - retrying in 5s"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
 
      - name: Flag failed fetchers
        if: steps.psd.outcome == 'failure' || steps.cftc.outcome == 'failure' || steps.exports.outcome == 'failure' || steps.weather.outcome == 'failure'
        run: |
          echo "::error::A fetcher failed (PSD=${{ steps.psd.outcome }}, CFTC=${{ steps.cftc.outcome }}, Exports=${{ steps.exports.outcome }}, Weather=${{ steps.weather.outcome }}). The sources that succeeded were still saved; the failed one keeps its previous data."
          exit 1
 
